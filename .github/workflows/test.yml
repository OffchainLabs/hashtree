name: test
on: [pull_request, workflow_dispatch]

jobs:
  build:
    name: Library - ${{ matrix.settings.name }}
    runs-on: ${{ matrix.settings.runner }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: MacOS arm64
            target: aarch64-apple-darwin
            runner: macos-latest
          - name: Linux x86
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - name: Linux arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - name: Linux x86 using clang
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cc: clang
          - name: Linux arm64 using clang
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cc: clang
          - name: Windows x86
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - name: Windows arm64
            target: aarch64-pc-windows-msvc
            runner: windows-latest
          - name: Linux RISC-V 64
            target: riscv64-unknown-linux-gnu
            runner: ubuntu-latest
            cc: riscv64-linux-gnu-gcc
            qemu: qemu-riscv64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install RISC-V toolchain and QEMU
        if: ${{ matrix.settings.qemu }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user
      - name: Cross-Compile Build
        if: ${{ matrix.settings.cc != '' }}
        run: CC=${{ matrix.settings.cc }} make all
      - name: Build
        if: ${{ !matrix.settings.cc }}
        run: make all
      - name: Run tests with QEMU
        if: ${{ matrix.settings.qemu }}
        run: ${{ matrix.settings.qemu }} -cpu rva23s64,zbc=true,zbkb=true,zbkc=true,zbkx=true,zknd=true,zkne=true,zknh=true,zkt=true -L /usr/riscv64-linux-gnu ./build/test
      - name: Run tests
        if: ${{ !matrix.settings.qemu }}
        run: ./build/test

  go-bindings:
    name: Go Bindings - ${{ matrix.settings.name }}
    runs-on: ${{ matrix.settings.runner }}
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.21', '1.22.x' ]
        settings:
          - name: MacOS arm64
            target: aarch64-apple-darwin
            runner: macos-latest
          - name: MacOS x86
            target: x86_64-apple-darwin
            runner: macos-15-intel
            generic_only: true
          - name: Linux x86
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - name: Linux arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - name: Linux x86 using clang
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cc: clang
          - name: Linux arm64 using clang
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cc: clang
          - name: Windows x86
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - name: Windows arm64
            target: aarch64-pc-windows-msvc
            runner: windows-latest
          - name: Linux RISC-V 64
            target: riscv64-unknown-linux-gnu
            runner: ubuntu-latest
            cc: riscv64-linux-gnu-gcc
            qemu: qemu-riscv64
            goarch: riscv64
            cross_pkg: gcc-riscv64-linux-gnu
            syso_name: hashtree_linux_riscv64.syso
            qemu_cpu: rva23s64,zbc=true,zbkb=true,zbkc=true,zbkx=true,zknd=true,zkne=true,zknh=true,zkt=true
            qemu_ld: /usr/riscv64-linux-gnu
          - name: Linux arm64 NEON (QEMU)
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cc: aarch64-linux-gnu-gcc
            qemu: qemu-aarch64
            goarch: arm64
            cross_pkg: gcc-aarch64-linux-gnu
            syso_name: hashtree_linux_arm64.syso
            qemu_cpu: cortex-a72
            qemu_ld: /usr/aarch64-linux-gnu
            test_tags: neonforce
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install cross toolchain and QEMU
        if: ${{ matrix.settings.qemu }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.settings.cross_pkg }} qemu-user
      - name: Cross-Compile Build
        if: ${{ matrix.settings.cc != '' && !matrix.settings.qemu }}
        run: CC=${{ matrix.settings.cc }} make go_bindings
      - name: Build
        if: ${{ !matrix.settings.cc && !matrix.settings.generic_only }}
        run: make go_bindings
      - name: Build (generic only)
        if: ${{ matrix.settings.generic_only }}
        run: go build .
      - name: Cross-Compile Build (QEMU)
        if: ${{ matrix.settings.qemu }}
        run: |
          CC=${{ matrix.settings.cc }} make go_bindings
          mv hashtree.syso ${{ matrix.settings.syso_name }}
      - name: Run tests
        if: ${{ !matrix.settings.qemu }}
        run: go test .
      - name: Run tests with QEMU
        if: ${{ matrix.settings.qemu }}
        run: |
          CGO_ENABLED=1 CC=${{ matrix.settings.cc }} GOOS=linux GOARCH=${{ matrix.settings.goarch }} go test -c -tags "${{ matrix.settings.test_tags }}" -o test.bin
          ${{ matrix.settings.qemu }} -cpu ${{ matrix.settings.qemu_cpu }} -L ${{ matrix.settings.qemu_ld }} ./test.bin
      - name: Run benchmarks
        if: ${{ !matrix.settings.qemu }}
        run: go test -bench=.

  # No RISC-V CPU may hit an illegal instruction, whatever it supports. Ubuntu's
  # own RISC-V libc needs RVA23, so the older CPUs are tested in a Debian
  # container, whose userland runs on plain RV64GC.
  riscv-cpus:
    name: RISC-V - ${{ matrix.cpu.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cpu:
          - name: no extensions
            flags: rv64,zbb=false
          - name: Zbb
            flags: rv64,zbb=true
          - name: Zbb and Zk
            flags: rv64,zbb=true,zbc=true,zbkb=true,zbkc=true,zbkx=true,zknd=true,zkne=true,zknh=true,zkt=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test library and Go bindings with QEMU
        run: |
          docker run --rm -v "$PWD:/w" -w /w -v "$(go env GOROOT):/usr/local/go:ro" \
            -e QEMU_CPU="${{ matrix.cpu.flags }}" debian:trixie bash -euc '
              export DEBIAN_FRONTEND=noninteractive PATH=/usr/local/go/bin:$PATH
              export CC=riscv64-linux-gnu-gcc GOFLAGS=-buildvcs=false GOTOOLCHAIN=local
              apt-get update -qq
              apt-get install -y -qq ca-certificates make binutils gcc-riscv64-linux-gnu qemu-user >/dev/null
              make all
              qemu-riscv64 -cpu "$QEMU_CPU" -L /usr/riscv64-linux-gnu ./build/test
              make go_bindings
              mv hashtree.syso hashtree_linux_riscv64.syso
              CGO_ENABLED=1 GOOS=linux GOARCH=riscv64 go test -c -o test.riscv64
              qemu-riscv64 -cpu "$QEMU_CPU" -L /usr/riscv64-linux-gnu ./test.riscv64
            '

  rust-bindings:
    name: Rust Bindings - ${{ matrix.settings.name }}
    runs-on: ${{ matrix.settings.runner }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: MacOS arm64
            target: aarch64-apple-darwin
            runner: macos-latest
          - name: Linux x86
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - name: Linux arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use-docker: true
          - name: Windows x86
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          # - name: Windows arm64
          #   target: aarch64-pc-windows-msvc
          #   runner: windows-latest
          #   use-docker: true
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: Set up QEMU
      if: ${{ matrix.settings.use-docker && matrix.settings.runner == 'ubuntu-latest' }}
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64
    - name: Build in docker
      if: ${{ matrix.settings.use-docker }}
      run: |
        docker buildx build \
          --build-arg TARGET=${{ matrix.settings.target }} \
          --platform linux/arm64 \
          -t ${{ matrix.settings.target }} \
          .
    - name: install rustup
      if: ${{ !matrix.settings.use-docker }}
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs > rustup-init.sh
        sh rustup-init.sh -y --default-toolchain none
        rustup target add ${{ matrix.settings.target }}
    - name: Build and Test
      if: ${{ !matrix.settings.use-docker }}
      run: |
        cargo build --release --target ${{ matrix.settings.target }}
        cargo test --target ${{ matrix.settings.target }}

  nim:
    name: nim
    runs-on: ubuntu-latest
    steps:
      - uses: jiro4989/setup-nim-action@v1
      - uses: actions/checkout@v4
      - name: Run Nim test
        run: nim c -r tests/test_hashtree_abi.nim
